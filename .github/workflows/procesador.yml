name: Procesador Vectorial y Extractor de Camisetas

on:
  push:
    paths:
      - 'input_normal/**'
      - 'input_camisetas/**'
  workflow_dispatch:

jobs:
  procesar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v3

      - name: Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar herramientas de procesamiento
        run: |
          python -m pip install --upgrade pip
          pip install vtracer rembg Pillow

      - name: Procesar Vectorización Normal
        run: python script_vectorizar.py

      - name: Extraer y Vectorizar Camisetas
        run: python script_extraer_camisetas.py

      - name: Subir ZIP Vectorial Normal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vectores-Normales-WinRAR
          path: output_normal/vectores_normales.zip

      - name: Subir ZIP Artes de Camisetas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Artes-Camisetas-Vectorizados-WinRAR
          path: output_camisetas/artes_camisetas_vectorizados.zip
