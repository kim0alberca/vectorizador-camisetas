name: Procesador de Vectores y Camisetas

on:
  push:
    paths:
      - 'input_normal/**'
      - 'input_camisetas/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  procesar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema y Python
        run: |
          sudo apt-get update
          sudo apt-get install -y potrace potrace-extra
          python -m pip install --upgrade pip
          pip install opencv-python pillow numpy

      - name: Crear carpetas de salida si no existen
        run: |
          mkdir -p output_normal output_camisetas output_svg

      - name: Procesar Vectorización Normal
        run: |
          python script_vectorizar.py

      - name: Procesar Extracción de Camisetas
        run: |
          python script_extraer_camisetas.py

      - name: Mover archivos a carpetas correspondientes
        run: |
          # Si script_vectorizar genera en output_svg, aseguramos moverlos a output_normal
          if [ -d "output_svg" ] && [ "$(ls -A output_svg)" ]; then
            cp output_svg/* output_normal/ 2>/dev/null || true
          fi

      - name: Subir cambios y vectores al repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output_normal/ output_camisetas/ output_svg/ 2>/dev/null || true
          git commit -m "Auto-generación de vectores SVG" || exit 0
          git push
