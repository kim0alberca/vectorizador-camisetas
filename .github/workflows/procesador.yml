name: Procesador de Vectores y Camisetas

on:
  push:
    paths:
      - 'input_normal/**'
      - 'input_camisetas/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  procesar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias del sistema y Python
        run: |
          sudo apt-get update
          sudo apt-get install -y potrace potrace-extra
          python -m pip install --upgrade pip
          pip install opencv-python pillow numpy

      - name: Procesar Vectorización Normal
        run: |
          python script_vectorizar.py

      - name: Procesar Extracción de Camisetas
        run: |
          python script_extraer_camisetas.py

      - name: Crear archivo comprimido ZIP
        run: |
          mkdir -p resultados
          if [ -d "output_svg" ] && [ "$(ls -A output_svg)" ]; then
            cp output_svg/* resultados/ 2>/dev/null || true
          fi
          if [ -d "output_camisetas" ] && [ "$(ls -A output_camisetas)" ]; then
            cp output_camisetas/* resultados/ 2>/dev/null || true
          fi
          cd resultados && zip -r ../vectores_procesados.zip . && cd ..

      - name: Publicar Release para descarga directa
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Vectores Procesados
          files: vectores_procesados.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
