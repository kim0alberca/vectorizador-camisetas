<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectorizador HD Pro - Conservar Colores</title>
  
  <script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>

  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-bg: #161b26;
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-green: #00e676;
      --text-main: #ffffff;
      --text-dim: #a0aec0;
      --border-color: #2d3748;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 30px 15px; }

    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; }
    h1 { font-size: 32px; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
    p.subtitle { color: var(--text-dim); font-size: 16px; }

    .card { background: var(--card-bg); border: 2px dashed var(--border-color); border-radius: 16px; padding: 30px; margin-bottom: 30px; }
    
    .options-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px; text-align: left; }
    .option-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px; color: var(--accent-cyan); }
    .option-group select { width: 100%; padding: 10px; background: #0d1117; border: 1px solid var(--border-color); color: #fff; border-radius: 8px; font-size: 14px; }

    .drop-zone { border: 1px dashed var(--border-color); border-radius: 8px; padding: 30px; background: rgba(0,0,0,0.2); cursor: pointer; text-align: center; margin-bottom: 20px; transition: 0.2s; }
    .drop-zone:hover { background: rgba(0,242,254,0.05); border-color: var(--accent-cyan); }

    .file-input { display: none; }
    .btn-select { background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue)); color: #000; font-weight: bold; padding: 14px 28px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; width: 100%; transition: opacity 0.2s; }
    .btn-select:hover { opacity: 0.9; }

    .status-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; text-align: center; display: none; }
    .spinner { border: 4px solid rgba(255,255,255,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--accent-cyan); animation: spin 1s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .results-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; text-align: left; }
    .result-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 14px 20px; border-radius: 10px; border: 1px solid var(--border-color); }
    .result-name { font-weight: 600; color: #fff; word-break: break-all; }

    .btn-download-single { background: var(--accent-green); color: #000; font-weight: bold; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; transition: transform 0.2s; display: inline-block; white-space: nowrap; }
    .btn-download-single:hover { transform: scale(1.03); }
    
    .error-log { color: #ff5252; font-size: 13px; margin-top: 15px; text-align: left; background: rgba(255,0,0,0.1); padding: 10px; border-radius: 6px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Vectorizador HD (Fidelidad de Color)</h1>
      <p class="subtitle">Preserva los colores originales y perfecciona los bordes de letras y vectores</p>
    </header>

    <div class="card">
      <div class="options-grid">
        <div class="option-group">
          <label for="modeSelect">Modo de Color:</label>
          <select id="modeSelect">
            <option value="color" selected>Color Real (Fiel a la Imagen)</option>
            <option value="bw">Monocromo / Solo B/N</option>
          </select>
        </div>
        <div class="option-group">
          <label for="colorsCount">Cantidad de Colores:</label>
          <select id="colorsCount">
            <option value="16" selected>16 Colores (Recomendado Logos)</option>
            <option value="32">32 Colores (Detalle Alto)</option>
            <option value="64">64 Colores (Máxima Fidelidad)</option>
            <option value="8">8 Colores (Diseño Simple)</option>
          </select>
        </div>
        <div class="option-group">
          <label for="smoothSelect">Suavizado de Bordes:</label>
          <select id="smoothSelect">
            <option value="ultra" selected>Ultra-Suave (Letras y Círculos)</option>
            <option value="balanced">Balanceado</option>
            <option value="sharp">Bordes Rectos / Geométricos</option>
          </select>
        </div>
      </div>

      <div class="drop-zone" onclick="document.getElementById('inputImagenes').click()">
        <span id="labelImagenes">📁 Haz clic o arrastra aquí tus imágenes</span>
        <input type="file" id="inputImagenes" class="file-input" multiple onchange="actualizarEtiqueta()">
      </div>
      
      <button class="btn-select" onclick="procesarVectorizacionHD()">⚡ Vectorizar Mantenimiento Colores</button>
    </div>

    <div class="status-panel" id="statusPanel">
      <div class="spinner" id="spinner"></div>
      <h2 id="statusTitle">Procesando imagen...</h2>
      <p id="statusDesc" style="color: var(--text-dim); margin-top: 10px;">Renderizando paleta de colores y mejorando trazos...</p>
      
      <div id="resultsGrid" class="results-grid"></div>
      <div id="errorLog" class="error-log"></div>
    </div>
  </div>

  <script>
    function actualizarEtiqueta() {
      const files = document.getElementById('inputImagenes').files;
      document.getElementById('labelImagenes').innerText = files.length > 0 
        ? `✔ ${files.length} archivo(s) listo(s)` 
        : '📁 Haz clic o arrastra aquí tus imágenes';
    }

    async function procesarVectorizacionHD() {
      const files = document.getElementById('inputImagenes').files;
      if (files.length === 0) return alert("Por favor, selecciona al menos una imagen.");

      const panel = document.getElementById('statusPanel');
      const spinner = document.getElementById('spinner');
      const title = document.getElementById('statusTitle');
      const desc = document.getElementById('statusDesc');
      const resultsGrid = document.getElementById('resultsGrid');
      const errorLog = document.getElementById('errorLog');

      panel.style.display = 'block';
      spinner.style.display = 'block';
      resultsGrid.innerHTML = '';
      errorLog.style.display = 'none';
      errorLog.innerHTML = '';
      title.innerText = "Vectorizando a Color HD...";

      let procesadosExitosos = 0;
      let errores = [];

      const modo = document.getElementById('modeSelect').value;
      const numColores = parseInt(document.getElementById('colorsCount').value, 10);
      const suavizado = document.getElementById('smoothSelect').value;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        desc.innerText = `Procesando (${i + 1}/${files.length}): ${file.name}`;
        
        await new Promise(resolve => setTimeout(resolve, 80));

        try {
          const imageData = await preprocesarImagenSuperHD(file, modo);
          let svgContent = vectorizarConAltaCalidad(imageData, modo, numColores, suavizado);

          if (svgContent && svgContent.length > 100) {
            let nombreLimpio = file.name.replace(/\.[^/.]+$/, "") || `vector_${i + 1}`;
            agregarFilaDescarga(nombreLimpio, svgContent);
            procesadosExitosos++;
          } else {
            errores.push(`${file.name}: No se generó estructura SVG.`);
          }
        } catch (e) {
          console.error(e);
          errores.push(`${file.name}: ${e.message || e}`);
        }
      }

      spinner.style.display = 'none';

      if (procesadosExitosos > 0) {
        title.innerText = "¡Vectorización Completada con Éxito!";
        desc.innerText = "Descarga tus archivos SVG a color:";
      } else {
        title.innerText = "Error en el procesamiento";
        desc.innerText = "Revisa las alertas para más detalles.";
      }

      if (errores.length > 0) {
        errorLog.style.display = 'block';
        errorLog.innerHTML = "<strong>Detalles de lectura:</strong><br>" + errores.join("<br>");
      }
    }

    // Escalado 4X manteniendo datos de color RGB
    function preprocesarImagenSuperHD(file, modo) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const scale = 3; // Escalado 3X óptimo para conservar color y no saturar memoria
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            try {
              const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
              
              if (modo === 'bw') {
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                  const lum = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                  const val = lum > 160 ? 255 : 0;
                  data[i] = data[i+1] = data[i+2] = val;
                }
                ctx.putImageData(imgData, 0, 0);
              }

              resolve(imgData);
            } catch (err) {
              reject(new Error("Error procesando matriz gráfica."));
            }
          };
          img.onerror = () => reject(new Error("La imagen cargada no se pudo procesar."));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error("No se pudo leer el archivo."));
        reader.readAsDataURL(file);
      });
    }

    // Trazado vectorial ajustado para paleta multitono
    function vectorizarConAltaCalidad(imageData, modo, numColores, suavizado) {
      let ltresVal = 0.01;
      let qtresVal = 0.01;

      if (suavizado === 'balanced') {
        ltresVal = 0.1;
        qtresVal = 0.1;
      } else if (suavizado === 'sharp') {
        ltresVal = 1.0;
        qtresVal = 1.0;
      }

      const options = {
        corsenabled: false,
        ltres: ltresVal,
        qtres: qtresVal,
        pathomit: 2,
        rightangleenhance: true,
        colorsampling: modo === 'bw' ? 0 : 2,
        numberofcolors: modo === 'bw' ? 2 : numColores,
        mincolorratio: 0.005,
        colorquantcycles: 5,
        strokewidth: 0,
        linefilter: true
      };

      return ImageTracer.imagedataToSVG(imageData, options);
    }

    function agregarFilaDescarga(nombre, svgContent) {
      const resultsGrid = document.getElementById('resultsGrid');
      
      const blob = new Blob([svgContent], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      const row = document.createElement('div');
      row.className = 'result-row';
      row.innerHTML = `
        <span class="result-name">🎨 ${nombre}_Color_HD.svg</span>
        <a href="${url}" download="${nombre}_Color_HD.svg" class="btn-download-single">
          ⬇️ Descargar SVG a Color
        </a>
      `;
      resultsGrid.appendChild(row);
    }
  </script>
</body>
</html>
