<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectorizador Ultra HD - Auto-Adaptativo</title>
  
  <script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>

  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-bg: #161b26;
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-green: #00e676;
      --text-main: #ffffff;
      --text-dim: #a0aec0;
      --border-color: #2d3748;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 30px 15px; }

    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; }
    h1 { font-size: 32px; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
    p.subtitle { color: var(--text-dim); font-size: 16px; }

    .card { background: var(--card-bg); border: 2px dashed var(--border-color); border-radius: 16px; padding: 30px; margin-bottom: 30px; text-align: center; }

    .auto-badge { display: inline-block; background: rgba(0,242,254,0.1); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 20px; }

    .drop-zone { border: 1px dashed var(--border-color); border-radius: 8px; padding: 40px 20px; background: rgba(0,0,0,0.2); cursor: pointer; text-align: center; margin-bottom: 20px; transition: 0.2s; }
    .drop-zone:hover { background: rgba(0,242,254,0.05); border-color: var(--accent-cyan); }

    .file-input { display: none; }
    .btn-select { background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue)); color: #000; font-weight: bold; padding: 16px 32px; border: none; border-radius: 8px; cursor: pointer; font-size: 17px; width: 100%; transition: opacity 0.2s; }
    .btn-select:hover { opacity: 0.9; }

    .status-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; text-align: center; display: none; }
    .spinner { border: 4px solid rgba(255,255,255,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--accent-cyan); animation: spin 1s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .results-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; text-align: left; }
    .result-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 14px 20px; border-radius: 10px; border: 1px solid var(--border-color); }
    .result-info { display: flex; flex-direction: column; gap: 4px; }
    .result-name { font-weight: 600; color: #fff; word-break: break-all; }
    .result-meta { font-size: 12px; color: var(--accent-cyan); }

    .btn-download-single { background: var(--accent-green); color: #000; font-weight: bold; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; transition: transform 0.2s; display: inline-block; white-space: nowrap; }
    .btn-download-single:hover { transform: scale(1.03); }
    
    .error-log { color: #ff5252; font-size: 13px; margin-top: 15px; text-align: left; background: rgba(255,0,0,0.1); padding: 10px; border-radius: 6px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Vectorizador Ultra HD - Auto-Adaptativo</h1>
      <p class="subtitle">Ajuste inteligente de color y trazado limpio según la imagen</p>
    </header>

    <div class="card">
      <div class="auto-badge">✨ Motor IA Ligero: Detecta colores y suaviza bordes automáticamente</div>

      <div class="drop-zone" onclick="document.getElementById('inputImagenes').click()">
        <span id="labelImagenes">📁 Haz clic o arrastra aquí tus imágenes</span>
        <input type="file" id="inputImagenes" class="file-input" multiple onchange="actualizarEtiqueta()">
      </div>
      
      <button class="btn-select" onclick="procesarVectorizacionAuto()">🚀 Vectorizar Automáticamente</button>
    </div>

    <div class="status-panel" id="statusPanel">
      <div class="spinner" id="spinner"></div>
      <h2 id="statusTitle">Analizando imagen...</h2>
      <p id="statusDesc" style="color: var(--text-dim); margin-top: 10px;">Calculando densidad de color y mejorando curvatura de vectores...</p>
      
      <div id="resultsGrid" class="results-grid"></div>
      <div id="errorLog" class="error-log"></div>
    </div>
  </div>

  <script>
    function actualizarEtiqueta() {
      const files = document.getElementById('inputImagenes').files;
      document.getElementById('labelImagenes').innerText = files.length > 0 
        ? `✔ ${files.length} archivo(s) listo(s)` 
        : '📁 Haz clic o arrastra aquí tus imágenes';
    }

    async function procesarVectorizacionAuto() {
      const files = document.getElementById('inputImagenes').files;
      if (files.length === 0) return alert("Por favor, selecciona al menos una imagen.");

      const panel = document.getElementById('statusPanel');
      const spinner = document.getElementById('spinner');
      const title = document.getElementById('statusTitle');
      const desc = document.getElementById('statusDesc');
      const resultsGrid = document.getElementById('resultsGrid');
      const errorLog = document.getElementById('errorLog');

      panel.style.display = 'block';
      spinner.style.display = 'block';
      resultsGrid.innerHTML = '';
      errorLog.style.display = 'none';
      errorLog.innerHTML = '';
      title.innerText = "Procesando Imágenes...";

      let procesadosExitosos = 0;
      let errores = [];

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        desc.innerText = `Analizando (${i + 1}/${files.length}): ${file.name}`;
        
        await new Promise(resolve => setTimeout(resolve, 80));

        try {
          const { imageData, configAuto } = await preprocesarYAnalizarImagen(file);
          let svgContent = ImageTracer.imagedataToSVG(imageData, configAuto);

          if (svgContent && svgContent.length > 100) {
            let nombreLimpio = file.name.replace(/\.[^/.]+$/, "") || `vector_${i + 1}`;
            agregarFilaDescarga(nombreLimpio, svgContent, configAuto._metaInfo);
            procesadosExitosos++;
          } else {
            errores.push(`${file.name}: No se pudo generar la estructura SVG.`);
          }
        } catch (e) {
          console.error(e);
          errores.push(`${file.name}: ${e.message || e}`);
        }
      }

      spinner.style.display = 'none';

      if (procesadosExitosos > 0) {
        title.innerText = "¡Vectorización Completada!";
        desc.innerText = "Tus imágenes han sido analizadas y adaptadas automáticamente:";
      } else {
        title.innerText = "Error en el procesamiento";
        desc.innerText = "Revisa las alertas para más detalles.";
      }

      if (errores.length > 0) {
        errorLog.style.display = 'block';
        errorLog.innerHTML = "<strong>Detalles:</strong><br>" + errores.join("<br>");
      }
    }

    // Preprocesado con análisis de píxeles para configuración adaptativa
    function preprocesarYAnalizarImagen(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            // Escalado 3x con suavizado para evitar serruchos en tipografía
            const scale = 3; 
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            try {
              const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
              const data = imgData.data;

              // Muestreo de colores únicos para detectar complejidad
              const colorSet = new Set();
              const step = 16; // Mapeo rápido cada 16px para mejor rendimiento
              for (let i = 0; i < data.length; i += 4 * step) {
                const r = Math.round(data[i] / 32) * 32;
                const g = Math.round(data[i+1] / 32) * 32;
                const b = Math.round(data[i+2] / 32) * 32;
                colorSet.add(`${r},${g},${b}`);
              }

              const numColoresDetectados = colorSet.size;
              let numColoresFinal = 16;
              let pathOmitVal = 4; // Elimina ruido de orillas
              let ltresVal = 0.01;
              let qtresVal = 0.01;
              let metaInfo = "";

              if (numColoresDetectados <= 4) {
                numColoresFinal = 4;
                pathOmitVal = 8; // Filtra imperfecciones mayores en texto/logos
                metaInfo = "Modo: Arte Plano / Texto (Alta Precisión)";
              } else if (numColoresDetectados <= 12) {
                numColoresFinal = 8;
                pathOmitVal = 6;
                metaInfo = "Modo: Ilustración Simple";
              } else if (numColoresDetectados <= 28) {
                numColoresFinal = 24;
                pathOmitVal = 3;
                metaInfo = "Modo: Diseño Multicolor";
              } else {
                numColoresFinal = 48;
                pathOmitVal = 2;
                metaInfo = "Modo: Gráficos Complejos";
              }

              const configAuto = {
                corsenabled: false,
                ltres: ltresVal,
                qtres: qtresVal,
                pathomit: pathOmitVal,
                rightangleenhance: true,
                colorsampling: 2,
                numberofcolors: numColoresFinal,
                mincolorratio: 0.002,
                colorquantcycles: 5,
                strokewidth: 0,
                linefilter: true,
                _metaInfo: metaInfo
              };

              resolve({ imageData: imgData, configAuto: configAuto });
            } catch (err) {
              reject(new Error("Error procesando los datos de la imagen."));
            }
          };
          img.onerror = () => reject(new Error("La imagen cargada no se pudo procesar."));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error("No se pudo leer el archivo."));
        reader.readAsDataURL(file);
      });
    }

    function agregarFilaDescarga(nombre, svgContent, metaInfo) {
      const resultsGrid = document.getElementById('resultsGrid');
      
      const blob = new Blob([svgContent], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      const row = document.createElement('div');
      row.className = 'result-row';
      row.innerHTML = `
        <div class="result-info">
          <span class="result-name">🎨 ${nombre}_Vector.svg</span>
          <span class="result-meta">⚡ ${metaInfo}</span>
        </div>
        <a href="${url}" download="${nombre}_Vector.svg" class="btn-download-single">
          ⬇️ Descargar SVG
        </a>
      `;
      resultsGrid.appendChild(row);
    }
  </script>
</body>
</html>
