<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectorizador Pro - Nivel Vector Magic con Remoción de Fondo</title>
  
  <script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>

  <style>
    :root {
      --bg-dark: #0a0e17;
      --card-bg: #161b26;
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-green: #00e676;
      --text-main: #ffffff;
      --text-dim: #a0aec0;
      --border-color: #2d3748;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 30px 15px; }

    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; }
    h1 { font-size: 30px; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
    p.subtitle { color: var(--text-dim); font-size: 15px; }

    .card { background: var(--card-bg); border: 2px dashed var(--border-color); border-radius: 16px; padding: 30px; margin-bottom: 30px; text-align: center; }

    .auto-badge { display: inline-block; background: rgba(0,242,254,0.1); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 20px; }

    .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; text-align: left; }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .control-group label { font-size: 13px; color: var(--text-dim); font-weight: 600; }
    .control-group select, .control-group input { background: #0d1117; color: #fff; border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; outline: none; }

    .checkbox-group { display: flex; align-items: center; gap: 10px; cursor: pointer; margin-top: 10px; }
    .checkbox-group input { width: 18px; height: 18px; accent-color: var(--accent-cyan); }

    .drop-zone { border: 1px dashed var(--border-color); border-radius: 8px; padding: 30px 20px; background: rgba(0,0,0,0.2); cursor: pointer; text-align: center; margin-bottom: 20px; transition: 0.2s; }
    .drop-zone:hover { background: rgba(0,242,254,0.05); border-color: var(--accent-cyan); }

    .file-input { display: none; }
    .btn-select { background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue)); color: #000; font-weight: bold; padding: 16px 32px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; width: 100%; transition: opacity 0.2s; }
    .btn-select:hover { opacity: 0.9; }

    .status-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; text-align: center; display: none; }
    .spinner { border: 4px solid rgba(255,255,255,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--accent-cyan); animation: spin 1s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .results-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; text-align: left; }
    .result-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 14px 20px; border-radius: 10px; border: 1px solid var(--border-color); }
    .result-info { display: flex; flex-direction: column; gap: 4px; }
    .result-name { font-weight: 600; color: #fff; word-break: break-all; }
    .result-meta { font-size: 12px; color: var(--accent-green); }

    .btn-download-single { background: var(--accent-green); color: #000; font-weight: bold; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; transition: transform 0.2s; display: inline-block; white-space: nowrap; }
    .btn-download-single:hover { transform: scale(1.03); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Vectorizador Pro (Ultra Definición & Sin Fondo)</h1>
      <p class="subtitle">Modo Tipografía/Geometría limpia con separación de capas cromáticas</p>
    </header>

    <div class="card">
      <div class="auto-badge">🚀 Algoritmo de Preservación Tipográfica Activado</div>

      <div class="controls-grid">
        <div class="control-group">
          <label for="presetMode">Tipo de Diseño:</label>
          <select id="presetMode">
            <option value="text" selected>Textos y Logotipos (Bordes Afilados)</option>
            <option value="graphic">Ilustraciones y Formas Suaves</option>
          </select>
        </div>

        <div class="control-group">
          <label for="colorCount">Cantidad de Colores:</label>
          <select id="colorCount">
            <option value="2">2 Colores (Texto / Silueta)</option>
            <option value="4" selected>3 - 4 Colores (Diseño Estándar)</option>
            <option value="8">6 - 8 Colores (Complejo)</option>
          </select>
        </div>
      </div>

      <label class="checkbox-group">
        <input type="checkbox" id="removeBgCheck" checked>
        <span><strong>Eliminar Fondo Automáticamente</strong> (Remueve el color dominante del lienzo)</span>
      </label>

      <br>

      <div class="drop-zone" onclick="document.getElementById('inputImagenes').click()">
        <span id="labelImagenes">📁 Carga o arrastra tus imágenes aquí</span>
        <input type="file" id="inputImagenes" class="file-input" multiple onchange="actualizarEtiqueta()">
      </div>
      
      <button class="btn-select" onclick="procesarVectorizacionProfesional()">⚡ Vectorizar en Calidad Profesional</button>
    </div>

    <div class="status-panel" id="statusPanel">
      <div class="spinner" id="spinner"></div>
      <h2 id="statusTitle">Vectorizando...</h2>
      <p id="statusDesc" style="color: var(--text-dim); margin-top: 10px;">Analizando tipografía, aislando fondo y organizando capas...</p>
      
      <div id="resultsGrid" class="results-grid"></div>
    </div>
  </div>

  <script>
    function actualizarEtiqueta() {
      const files = document.getElementById('inputImagenes').files;
      document.getElementById('labelImagenes').innerText = files.length > 0 
        ? `✔ ${files.length} archivo(s) listo(s)` 
        : '📁 Carga o arrastra tus imágenes aquí';
    }

    async function procesarVectorizacionProfesional() {
      const files = document.getElementById('inputImagenes').files;
      if (files.length === 0) return alert("Por favor, selecciona al menos una imagen.");

      const panel = document.getElementById('statusPanel');
      const spinner = document.getElementById('spinner');
      const title = document.getElementById('statusTitle');
      const desc = document.getElementById('statusDesc');
      const resultsGrid = document.getElementById('resultsGrid');

      panel.style.display = 'block';
      spinner.style.display = 'block';
      resultsGrid.innerHTML = '';
      title.innerText = "Optimizando Geometría Vectorial...";

      const preset = document.getElementById('presetMode').value;
      const numColors = parseInt(document.getElementById('colorCount').value);
      const removeBg = document.getElementById('removeBgCheck').checked;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        desc.innerText = `Procesando (${i + 1}/${files.length}): ${file.name}`;
        await new Promise(resolve => setTimeout(resolve, 80));

        try {
          // Paso 1: Pre-procesamiento de nitidez en Canvas
          const { canvas, bgColorHex } = await optimizarMapaDeBits(file);

          // Paso 2: Trazado inteligente enfocado en preservar esquinas en tipografía
          let rawSvg = vectorizarConSoporteTipografico(canvas, numColors, preset);

          // Paso 3: Estructuración por capas y eliminación estricta de fondo
          let svgFinal = procesarEstructuraYSinFondo(rawSvg, removeBg, bgColorHex);

          let nombreLimpio = file.name.replace(/\.[^/.]+$/, "");
          agregarFilaDescarga(nombreLimpio, svgFinal);
        } catch (e) {
          console.error(e);
        }
      }

      spinner.style.display = 'none';
      title.innerText = "¡Vectorización de Alto Nivel Lista!";
      desc.innerText = "Vectores con tipografía clara, capas ordenadas y sin fondo:";
    }

    // 1. Amplifica la resolución x4 y detecta el color de las esquinas (Fondo)
    function optimizarMapaDeBits(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // Super-Sampling x4 para darle máxima definición a los textos pequeños
            const scale = 4;
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            // Muestra del color de fondo en la esquina superior izquierda (0,0)
            const pixel = ctx.getImageData(5, 5, 1, 1).data;
            const bgColorHex = rgbToHex(pixel[0], pixel[1], pixel[2]);

            resolve({ canvas, bgColorHex });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    // 2. Trazado con tolerancia de esquinas
    function vectorizarConSoporteTipografico(canvas, numColors, preset) {
      const ctx = canvas.getContext('2d');
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);

      const isTextMode = preset === 'text';

      const options = {
        corsenabled: false,
        // Parámetros críticos para que las letras mantengan esquinas rectificadas
        ltres: isTextMode ? 0.01 : 0.5,      // Cero deformación en trazos rectos
        qtres: isTextMode ? 0.01 : 0.5,      // Ajuste Bezier de alta fidelidad
        pathomit: 8,                         // Omite únicamente pequeños lunares de ruido
        rightangleenhance: isTextMode,       // RECTIFICA ESQUINAS A 90º (Ideal para tipografías)
        colorsampling: 2,
        numberofcolors: numColors,
        mincolorratio: 0.005,
        colorquantcycles: 8,
        strokewidth: 0,
        linefilter: true
      };

      return ImageTracer.imagedataToSVG(imgData, options);
    }

    // 3. Organiza en capas <g> y elimina la capa contenedora del fondo
    function procesarEstructuraYSinFondo(svgString, removeBg, bgColorHex) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(svgString, 'image/svg+xml');
      const svgEl = doc.querySelector('svg');

      if (!svgEl) return svgString;

      const paths = Array.from(doc.querySelectorAll('path'));
      const colorGroups = {};

      paths.forEach(path => {
        let fill = path.getAttribute('fill') || '#000000';
        fill = fill.toLowerCase();
        if (!colorGroups[fill]) colorGroups[fill] = [];
        colorGroups[fill].push(path);
      });

      svgEl.innerHTML = '';

      // Identificar y omitir la capa del fondo
      let targetBg = bgColorHex.toLowerCase();

      let layerIndex = 1;
      for (const [color, pathList] of Object.entries(colorGroups)) {
        
        // Si la opción de eliminar fondo está activa y el color coincide con el fondo detectado, se omite
        if (removeBg && sonColoresSimilares(color, targetBg)) {
          continue; 
        }

        const group = doc.createElementNS('http://www.w3.org/2000/svg', 'g');
        const hexName = color.replace('#', '');
        group.setAttribute('id', `Capa_${layerIndex}_#${hexName}`);
        group.setAttribute('fill', color);

        pathList.forEach(p => {
          p.removeAttribute('fill');
          group.appendChild(p);
        });

        svgEl.appendChild(group);
        layerIndex++;
      }

      return new XMLSerializer().serializeToString(doc);
    }

    // Comparador numérico para tolerar ligeras variaciones de color de fondo
    function sonColoresSimilares(hex1, hex2) {
      if (hex1 === hex2) return true;
      let c1 = parseInt(hex1.replace('#',''), 16);
      let c2 = parseInt(hex2.replace('#',''), 16);
      
      let r1 = (c1 >> 16) & 255, g1 = (c1 >> 8) & 255, b1 = c1 & 255;
      let r2 = (c2 >> 16) & 255, g2 = (c2 >> 8) & 255, b2 = c2 & 255;

      let diff = Math.abs(r1 - r2) + Math.abs(g1 - g2) + Math.abs(b1 - b2);
      return diff < 30; // Margen de tolerancia cromática
    }

    function agregarFilaDescarga(nombre, svgContent) {
      const resultsGrid = document.getElementById('resultsGrid');
      const blob = new Blob([svgContent], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      const row = document.createElement('div');
      row.className = 'result-row';
      row.innerHTML = `
        <div class="result-info">
          <span class="result-name">👑 ${nombre}_Pro_SinFondo.svg</span>
          <span class="result-meta">✔ Tipografía Definida + Sin Fondo + Capas Limpias</span>
        </div>
        <a href="${url}" download="${nombre}_Pro_SinFondo.svg" class="btn-download-single">
          ⬇️ Descargar SVG Profesional
        </a>
      `;
      resultsGrid.appendChild(row);
    }
  </script>
</body>
</html>
